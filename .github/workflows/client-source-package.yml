name: Build client source package

on:
  push:
    branches:
      - client-delivery-package
    paths:
      - ".github/workflows/client-source-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Prepare complete client ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate lockfile, install, and check production build
        id: verify
        continue-on-error: true
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          set -e
          npm install --package-lock-only --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run build

      - name: Record verification result
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          if [ "$VERIFY_OUTCOME" = "success" ]; then
            printf "Production build: PASSED\\n" > BUILD-STATUS.txt
          else
            printf "Production build: NOT PASSED\\n" > BUILD-STATUS.txt
            printf "See the GitHub Actions log for the exact build error.\\n" >> BUILD-STATUS.txt
          fi

      - name: Assemble source archive
        if: always()
        run: |
          set -euo pipefail
          test -s package-lock.json
          mkdir -p staging
          git archive --format=tar HEAD | tar -xf - -C staging
          cp package-lock.json staging/package-lock.json
          cp BUILD-STATUS.txt staging/BUILD-STATUS.txt
          printf "Repository: ffgg35646-ops/bb\\nBranch snapshot: client-delivery-package\\nSource base commit: 0e755aaeb30e7c4b8e4f7\\n" > staging/PACKAGE-METADATA.txt
          (cd staging && zip -qr ../BB-Client-Source.zip .)
          sha256sum BB-Client-Source.zip > BB-Client-Source.zip.sha256
          unzip -t BB-Client-Source.zip

      - name: Upload client source package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bb-client-source
          path: |
            BB-Client-Source.zip
            BB-Client-Source.zip.sha256
          if-no-files-found: error
          retention-days: 30
